<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Computer Inspector</title>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      background: #f4f5f7; margin: 16px; 
    }
    #grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); 
      gap: 12px; 
    }
    .card { 
      background: #fff; 
      border-radius: 10px; 
      padding: 12px 14px;
      border-left: 6px solid gray; 
    }
    .card.ok { 
      border-left-color: #1f9d55; 
    }
    .card.warn { 
      border-left-color: #d98e04; 
    }
    .card.crit { 
      border-left-color: #d6342c; 
    }
    .card.offline {
      opacity: .5; 
    }
    .top {
      display: flex; 
      justify-content: space-between; 
      margin-bottom: 8px; }
    .name { 
      font-weight: 600; 
    }
    .sub { 
      font-size: 12px; 
      color: #666; 
    }
    .row { 
      display: grid; 
     grid-template-columns: 42px 1fr 48px; 
      gap: 8px;
      align-items: center; 
      font-size: 12px; 
      margin: 5px 0; 
    }
    .bar { 
      height: 7px; background: #e3e6ec; 
      border-radius: 4px; 
      overflow: hidden; 
    }
    .bar i { 
      display: block; 
      height: 100%; 
      background: #2f6fed; 
    }
    .na {
      border: ;
    }
    /* history: one small graph per value, last hour */
    .spark {
      display: grid;
      grid-template-columns: 42px 1fr 64px;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      margin: 3px 0;
    }
    .spark svg {
      width: 100%;
      height: 22px;
      display: block;
    }
    .spark .now {
      text-align: right;
    }
    .abn {
      color: #c62d25;
      font-weight: 600;
      font-size: 12px;
      margin: 6px 0 2px;
    }
    .spark.hot {
      color: #c62d25;
      font-weight: 600;
    }
    /* rules like #grid { display: grid } would otherwise override the hidden attribute */
    [hidden] {
      display: none !important;
    }
    /* seat map: one tile per seat, placed by layout.json (column, row); row 0 = front */
    #views {
      display: flex;
      gap: 6px;
      margin: 10px 0;
    }
    #views button {
      font: inherit;
      font-size: 14px;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid #c5cad3;
      border-radius: 8px;
      background: #fff;
      color: #1f2a37;
      cursor: pointer;
    }
    #views button[aria-pressed="true"] {
      background: #2f6fed;
      border-color: #2f6fed;
      color: #fff;
    }
    #views button:focus-visible,
    #mapwrap:focus-visible {
      outline: 2px solid #2f6fed;
      outline-offset: 2px;
    }
    .note {
      font-size: 13px;
      color: #555;
      margin: 8px 0;
    }
    .front {
      text-align: center;
      font-size: 12px;
      color: #555;
      border-bottom: 2px solid #c5cad3;
      padding-bottom: 4px;
      margin-bottom: 10px;
    }
    #mapwrap {
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .room {
      display: grid;
      gap: 8px;
    }
    .seat {
      border: 2px solid #7a828c;
      border-radius: 8px;
      padding: 6px 8px;
      min-height: 56px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-wrap: anywhere;
    }
    .seat b { font-size: 13px; }
    .seat.ok      { background: #e3f4ea; border-color: #1f9d55; color: #14532d; }
    .seat.warn    { background: #fdf0d5; border-color: #a86f00; color: #6b3f00; }
    .seat.crit    { background: #fbe2e0; border-color: #d6342c; color: #8f1d17; }
    .seat.offline { background: #eceef1; border-color: #7a828c; color: #4b5563; }
    .seat.none    { background: transparent; border-style: dashed; color: #555; }
    .outside {
      margin-top: 16px;
      background: #fff;
      border-radius: 10px;
      padding: 10px 14px;
    }
    .outside h2 {
      font-size: 14px;
      margin: 0 0 6px;
    }
    .outside ul {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="status">กำลังเชื่อมต่อ...</div>
  <div id="ovall"></div>
  <div id="views" hidden>
    <button type="button" data-v="cards" aria-pressed="true">การ์ด</button>
    <button type="button" data-v="map" aria-pressed="false">ผังห้อง</button>
  </div>
  <div id="lnote" class="note" hidden></div>
  <div id="grid"></div>
  <div id="map" hidden></div>
  <script>
  // ---- history graphs (fetched every 10 s per machine from /history) ----
  const hist = {};          // id -> {data, err, at}
  const NET = { cpu: "CPU", rx: "↓ KB/s", tx: "↑ KB/s" };
  function loadHist(id) {
    const h = hist[id] || (hist[id] = { data: null, err: false, at: 0 });
    if (Date.now() - h.at < 10000) return;
    h.at = Date.now();
    fetch("/history?id=" + encodeURIComponent(id), { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => { h.data = d; h.err = false; })
      .catch(() => { h.err = true; });
  }
  // Polyline of the last hour; the dashed line is this machine's normal (baseline mean).
  function spark(d, key, hot) {
    const ys = d[key] || [];
    const mean = d.base && d.base[key] ? Number(d.base[key].mean) || 0 : 0;
    const top = key === "cpu" ? 100 : Math.max(1, ...ys, mean * 1.5);
    const W = 120, H = 22, n = ys.length;
    const y = v => (H - 1 - (Math.min(v, top) / top) * (H - 2)).toFixed(1);
    const pts = ys.map((v, i) => `${(i / (n - 1) * W).toFixed(1)},${y(v)}`).join(" ");
    const col = hot ? "#c62d25" : "#2f6fed";
    const by = y(mean);
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" x2="${W}" y1="${by}" y2="${by}" stroke="#8a929c" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
      <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
  }
  function histBlock(m) {
    loadHist(m.id);
    const h = hist[m.id];
    const abn = Array.isArray(m.abn) ? m.abn : [];
    let out = "";
    if (abn.length) out += `<div class="abn">ผิดไปจากปกติของเครื่องนี้: ${abn.map(k => esc(NET[k] || k)).join(", ")}</div>`;
    else if (m.learn) out += `<div class="sub">กำลังเรียนรู้ค่าปกติของเครื่องนี้ (ยังไม่แจ้งเตือน)</div>`;
    if (!h || (!h.data && !h.err)) return out + `<div class="sub">กำลังโหลดประวัติ...</div>`;
    if (h.err && !h.data) return out + `<div class="sub">โหลดประวัติไม่ได้ จะลองใหม่อัตโนมัติ</div>`;
    const d = h.data;
    if (!d.t || d.t.length < 2) return out + `<div class="sub">ยังมีข้อมูลไม่พอสำหรับกราฟ (เก็บทุก 10 วินาที)</div>`;
    for (const k of ["cpu", "rx", "tx"]) {
      const hot = abn.includes(k);
      const now = k === "cpu" ? `${Number(m.cpu).toFixed(0)}%` : Number(m[k]).toFixed(1);
      out += `<div class="spark${hot ? " hot" : ""}"><span>${NET[k]}</span>${spark(d, k, hot)}<span class="now">${now}</span></div>`;
    }
    return out + `<div class="sub">1 ชั่วโมงล่าสุด · เส้นประ = ค่าปกติ</div>`;
  }
  // ---- seat map ----
  // layout.json: {"cols":6,"seats":{"A-01":[0,0],"A-02":[1,0]}}  values are [column, row], row 0 = front
  let layout = null, view = "cards", lastDt = null, lastLabel = null;
  function checkLayout(j) {
    if (!j || typeof j !== "object" || Array.isArray(j)) return null;
    const cols = j.cols;
    if (!Number.isInteger(cols) || cols < 1 || cols > 30) return null;
    if (!j.seats || typeof j.seats !== "object" || Array.isArray(j.seats)) return null;
    const seats = [], used = new Set();
    let rows = 0;
    for (const [id, p] of Object.entries(j.seats)) {
      if (!Array.isArray(p) || p.length !== 2) return null;
      const [c, r] = p;
      if (!Number.isInteger(c) || !Number.isInteger(r) || c < 0 || c >= cols || r < 0 || r >= 50) return null;
      if (used.has(c + "," + r)) return null;     // two computers on one seat
      used.add(c + "," + r);
      seats.push({ id: String(id), c, r });
      rows = Math.max(rows, r + 1);
    }
    return seats.length ? { cols, rows, seats } : null;
  }
  function setView(v) {
    view = v;
    for (const b of document.querySelectorAll("#views button")) b.setAttribute("aria-pressed", String(b.dataset.v === v));
    try { localStorage.setItem("ci-view", v); } catch (e) {}
    if (lastDt) render(lastDt, lastLabel);
  }
  function loadLayout() {
    const note = document.getElementById("lnote");
    fetch("/layout.json", { cache: "no-store" })
      .then(r => {
        if (r.status === 404) throw new Error("missing");
        if (!r.ok) throw new Error("http");
        return r.json().catch(() => { throw new Error("bad"); });
      })
      .then(j => {
        layout = checkLayout(j);
        if (!layout) throw new Error("bad");
        document.getElementById("views").hidden = false;
        note.hidden = true;
        let saved = null;
        try { saved = localStorage.getItem("ci-view"); } catch (e) {}
        setView(saved === "map" ? "map" : "cards");
      })
      .catch(e => {
        layout = null;
        note.textContent = e.message === "missing"
          ? "ยังไม่มีผังที่นั่ง: วางไฟล์ layout.json ไว้โฟลเดอร์เดียวกับโปรแกรม server แล้วโหลดหน้านี้ใหม่"
          : e.message === "bad"
          ? "ไฟล์ layout.json ไม่ถูกต้อง จึงแสดงแบบการ์ดแทน"
          : "โหลดผังที่นั่งไม่ได้ จึงแสดงแบบการ์ดแทน";
        note.hidden = false;
        setView("cards");
      });
  }
  for (const b of document.querySelectorAll("#views button")) b.addEventListener("click", () => setView(b.dataset.v));
  function renderMap(ms, label) {
    const byId = new Map(ms.map(m => [m.id, m]));
    const inLayout = new Set(layout.seats.map(s => s.id));
    const tiles = layout.seats.map(s => {
      const m = byId.get(s.id);
      const st = m ? m.status : "none";
      const info = m ? label[m.status] : "ไม่มีข้อมูล";
      const cpu = m && m.status !== "offline" ? `<span>CPU ${Number(m.cpu).toFixed(0)}%</span>` : "";
      return `<div class="seat ${esc(st)}" style="grid-column:${s.c + 1};grid-row:${s.r + 1}">
        <b>${esc(s.id)}</b><span>${esc(info)}</span>${cpu}</div>`;
    }).join("");
    const out = ms.filter(m => !inLayout.has(m.id));
    const outside = out.length
      ? `<div class="outside"><h2>ไม่อยู่ในผัง (${out.length})</h2><ul>${out.map(m => `<li>${esc(m.id)}: ${esc(label[m.status])}</li>`).join("")}</ul></div>`
      : "";
    return `<div id="mapwrap" tabindex="0" role="region" aria-label="ผังห้อง (เลื่อนซ้ายขวาได้)"><div class="front">หน้าห้อง</div>
      <div class="room" style="grid-template-columns:repeat(${layout.cols},minmax(72px,1fr))">${tiles}</div></div>${outside}`;
  }
  function render(dt, label) {
    const mapOn = view === "map" && layout;
    document.getElementById("grid").hidden = !!mapOn;
    document.getElementById("map").hidden = !mapOn;
    if (mapOn) document.getElementById("map").innerHTML = renderMap(dt.machines, label);
    else document.getElementById("grid").innerHTML = dt.cards;
  }
  const esc = (s) => String(s).replace(/[&<>"']/g,c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  function connect() {
    const hn = location.hostname || "127.0.0.1";
    const ws = new WebSocket("ws://" + hn + ":8080/dashboard");
    const label = { ok: "ปกติ", warn: "เฝ้าระวัง", crit: "วิกฤต", offline: "ออฟไลน์" };
    const bar = (label, v) => {
      const p=Math.min(100,Math.max(0,Number(v)));
      return `<div class="row"><span>${label}</span>
              <div class="bar"><i style="width:${p}%"></i></div>
              <span>${p.toFixed(0)}%</span></div>`;
    };
    ws.onopen = () => {
      document.getElementById("status").textContent = "เชื่อมต่อแล้ว";
    };
    ws.onmessage = (e) => {
      const dt = JSON.parse(e.data);
      dt.machines.sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
      let arr={ok: 0, warn: 0, crit: 0,offline: 0};
      for (const m of dt.machines) arr[m.status]++;
      let crd = dt.machines.map(m=>` <div class="card ${m.status}">
        <div class="top">
          <span class="name">${esc(m.id)}</span>
          <span class="sub">${esc(m.ip)} status: ${label[m.status]}</span>
          </div>
          ${bar("CPU", m.cpu)}
          ${bar("RAM", m.ram)}
          ${bar("DISK", m.disk)}
        <div class="sub">↓ ${Number(m.rx).toFixed(1)} KB/s &nbsp; ↑ ${Number(m.tx).toFixed(1)} KB/s</div>
          ${histBlock(m)}
      </div>`).join("");
      const ovl=Object.keys(label).map(k=>`${label[k]} ${arr[k]}`).join(" : ");
      if (dt.machines.length===0) crd=`<p class="na">No Available PC yet</p>`;
      document.getElementById("ovall").innerHTML=ovl;
      dt.cards = crd;
      lastDt = dt; lastLabel = label;
      render(dt, label);
    };
    ws.onclose = () => {
      document.getElementById("status").textContent = "หลุดการเชื่อมต่อ กำลังต่อใหม่...";
      setTimeout(connect, 2000);
    };

  }
  loadLayout();
  connect();
</script>
</body>
</html>
